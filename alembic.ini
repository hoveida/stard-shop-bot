# Alembic database migrations. The bot runs `upgrade head` automatically on start and after an update.
# Manual use:  alembic upgrade head   |   alembic current   |   alembic history
# The database URL comes from DATABASE_URL or DATABASE_PATH in .env (not from this file).
# Keep this file ASCII-only: Alembic reads it with the OS locale encoding (fails on non-UTF-8 Windows).
[alembic]
script_location = bot/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
